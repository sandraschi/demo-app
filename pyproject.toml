[project]
name = "demo_app"
version = "0.1.0"
description = "SOTA demo fullstack app - fleet MCP hookups, scheduler, robot patrols, roster, shop"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastmcp[tasks]>=3.4.4,<4",
    "prefab-ui>=0.14.0",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "APScheduler>=3.10,<4",
]

[project.scripts]
demo_app-server = "demo_app.server:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["S104", "S310", "S311", "S314", "S608", "S108", "S603", "S301", "S103", "S112", "S105", "S607", "S701", "S102", "S307", "S324", "ASYNC230", "B008", "B904", "B025", "B019", "B023", "C901", "UP035", "RUF006", "N806", "E501", "F841", "PLW1510", "BLE001", "RUF022", "E402", "F811", "B006", "B007", "RUF059", "RUF001", "RUF002", "S110", "RUF012", "DTZ005", "DTZ006", "DTZ001", "E741", "SIM115", "SIM102", "RUF100", "F401", "D103", "D101", "F821", "TRY002", "E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]